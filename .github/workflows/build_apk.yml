name: Build Release APK on Cloud

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_apk:
    name: Build Microbiology Portal APK (Cloud)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Set up Java 17 for Android Build
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Flutter SDK on Cloud
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Backup User Files & Generate Android Project
        run: |
          # حفظ ملف الكود و pubspec قبل توليد ملفات الأندرويد حتى لا يتم مسحها
          mkdir -p /tmp/backup
          if [ -f "lib/main.dart" ]; then
            cp lib/main.dart /tmp/backup/main.dart
          elif [ -f "main.dart" ]; then
            cp main.dart /tmp/backup/main.dart
          fi
          if [ -f "pubspec.yaml" ]; then
            cp pubspec.yaml /tmp/backup/pubspec.yaml
          fi

          # توليد بيئة الأندرويد الكاملة
          flutter create . --project-name micro_portal_app --org com.bsu.microbiology --platforms=android

          # استرجاع ملفاتك الأصلية بعد التوليد
          mkdir -p lib
          if [ -f "/tmp/backup/main.dart" ]; then
            cp /tmp/backup/main.dart lib/main.dart
          fi
          if [ -f "/tmp/backup/pubspec.yaml" ]; then
            cp /tmp/backup/pubspec.yaml pubspec.yaml
          fi

          # إزالة ملف اختبار العداد الافتراضي الذي يسبب فشل البناء
          rm -f test/widget_test.dart

      - name: 5. Configure Android Manifest & SDK Versions
        run: |
          # إضافة صلاحية الإنترنت في AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/><application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml

          # رفع compileSdk إلى 35 و minSdk إلى 21 لدعم flutter_inappwebview
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' android/app/build.gradle
            sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 35/g' android/app/build.gradle
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' android/app/build.gradle.kts
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts
          fi

      - name: 6. Install Flutter Dependencies
        run: flutter pub get

      - name: 7. Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: 8. Upload Ready-to-Download APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Microbiology-Portal-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
